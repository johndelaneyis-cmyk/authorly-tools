name: Lighthouse CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Run Lighthouse on production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Cloudflare Pages deploy to settle
        run: |
          echo "Waiting 90s for CF Pages deploy after push..."
          sleep 90
          for i in 1 2 3 4 5; do
            if curl -sSf https://authorly.tools/ > /dev/null; then
              echo "Production is up."
              break
            fi
            echo "Probe $i/5 failed, retrying in 30s..."
            sleep 30
          done

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://authorly.tools/
            https://authorly.tools/blurb
            https://authorly.tools/bio
            https://authorly.tools/keywords
            https://authorly.tools/categories
            https://authorly.tools/ads
            https://authorly.tools/tropes
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
