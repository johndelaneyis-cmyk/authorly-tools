<link rel="stylesheet" href="/tool.css">

<style>
/* Page-specific overrides for the 404 page only */
.notfound{padding:96px 0 64px;text-align:center}
/* !important is a defensive override against aggressive style-injecting browser
   extensions (Dark Reader, color-shifters) that otherwise stamp body-default
   size and color over the giant italic accent treatment. Real users without
   extensions see the same result either way. */
.notfound-code{font-family:"Fraunces",serif!important;font-variation-settings:"opsz" 144,"SOFT" 30,"WONK" 1!important;font-size:clamp(96px,18vw,144px)!important;line-height:1!important;font-weight:400!important;color:var(--accent)!important;font-style:italic!important;margin:0 0 12px!important;letter-spacing:-.05em!important}
.notfound h1{font-family:"Fraunces",serif;font-variation-settings:"opsz" 144,"SOFT" 30;font-weight:500;font-size:clamp(28px,5vw,40px);line-height:1.15;letter-spacing:-.02em;margin:0 0 16px;color:var(--ink)}
.notfound p{margin:0 0 28px;color:var(--ink-mute);font-size:17px;line-height:1.6}
.notfound .cta{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--paper);padding:14px 26px;border-radius:3px;text-decoration:none;font-family:"Fraunces",serif;font-size:16px;font-weight:500;letter-spacing:.02em;transition:background .2s,transform .1s}
.notfound .cta:hover{background:var(--accent)}
.notfound .cta:active{transform:translateY(1px)}
.notfound .cta-arrow{font-style:italic;transition:transform .2s}
.notfound .cta:hover .cta-arrow{transform:translateX(3px)}
@media (max-width:520px){
  .notfound{padding:64px 0 48px}
}
</style>
</head>
<body>
<div class="container">

<header class="site-header">

    <a href="/">Home</a>
    <a href="/#more">Tools</a>
    <a href="/#about">About</a>

<main class="notfound">
  <p class="notfound-code">404</p>
  <h1>Page not found.</h1>

  <a href="/" class="cta">Back to the comp finder <span class="cta-arrow">→</span></a>
</main>

<footer class="site-footer">

</footer>
