<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found - Authorly</title>
<meta name="description" content="The page you tried to reach doesn't exist on Authorly.">
<meta name="robots" content="noindex">
<link rel="canonical" href="https://authorly.tools/404">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:url" content="https://authorly.tools/">
<meta property="og:title" content="Authorly — Free Tools for Indie Authors">
<meta property="og:description" content="Free tools for indie authors: comp titles, blurbs, KDP keywords, categories, tropes, ad headlines, author bios.">
<meta property="og:image" content="https://authorly.tools/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:site_name" content="Authorly">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Authorly — Free Tools for Indie Authors">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..700,30..100&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--paper:#f6efe1;--paper-2:#fbf6ea;--ink:#1a1a1a;--ink-2:#2a2a2a;--ink-mute:#5a4a3a;--accent:#a3322a;--rule:#d8cdb8;--rule-soft:#f3ede0;--shadow:rgba(40,30,20,.08)}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:"Inter",system-ui,sans-serif;font-size:16px;line-height:1.65}
.container{max-width:680px;margin:0 auto;padding:0 28px}
.site-header{padding:36px 0 0}
.site-header-inner{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:18px}
.logo{font-family:"Fraunces",serif;font-variation-settings:"opsz" 144,"SOFT" 30;font-size:30px;font-weight:500;color:var(--ink);text-decoration:none;letter-spacing:-.5px}
.logo .accent{color:var(--accent);font-style:italic}
.nav a{color:var(--ink-mute);text-decoration:none;margin-left:22px;font-size:15px}
.nav a:hover{color:var(--ink)}
main{padding:96px 0 64px;text-align:center}
.code{font-family:"Fraunces",serif;font-variation-settings:"opsz" 144,"SOFT" 30;font-size:120px;line-height:1;font-weight:500;color:var(--accent);font-style:italic;margin:0 0 12px;letter-spacing:-2px}
h1{font-family:"Fraunces",serif;font-variation-settings:"opsz" 144,"SOFT" 30;font-size:36px;font-weight:500;line-height:1.2;margin:0 0 16px;letter-spacing:-.5px}
p{margin:0 0 24px;color:var(--ink-mute);font-size:17px}
.cta{display:inline-block;background:var(--ink);color:var(--paper-2);padding:12px 22px;border-radius:6px;text-decoration:none;font-size:15px;font-weight:500}
.cta:hover{background:var(--accent)}
.site-footer{border-top:1px solid var(--rule);padding:24px 0 36px;margin-top:48px;color:var(--ink-mute);font-size:14px;display:flex;flex-wrap:wrap;gap:18px;justify-content:space-between}
.site-footer a{color:var(--ink-mute);text-decoration:none}
.site-footer a:hover{color:var(--ink)}
@media (max-width:520px){.code{font-size:88px}h1{font-size:28px}.container{padding:0 20px}main{padding:64px 0 48px}}
</style>
</head>
<body>
<header class="site-header">
  <div class="container">
    <div class="site-header-inner">
      <a href="/" class="logo">Author<span class="accent">ly</span></a>
      <nav class="nav"><a href="/">Home</a><a href="/privacy">Privacy</a><a href="/terms">Terms</a></nav>
    </div>
  </div>
</header>
<main>
  <div class="container">
    <p class="code">404</p>
    <h1>Page not found.</h1>
    <p>That page isn't here. It may have moved, or never existed in the first place.</p>
    <a href="/" class="cta">Back to the comp title finder &rarr;</a>
  </div>
</main>
<footer class="site-footer">
  <div class="container" style="display:flex;justify-content:space-between;width:100%;flex-wrap:wrap;gap:18px">
    <span>Authorly &middot; <a href="/privacy">Privacy</a> &middot; <a href="/terms">Terms</a></span>
    <span>For indie authors</span>
  </div>
  <div class="container" style="text-align:center;margin-top:14px;font-size:12px;width:100%">Built by Darren &middot; 2026</div>
</footer>
</body>
</html>
